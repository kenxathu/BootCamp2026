services:
  # -------------------------------------------------------------
  # pfSense Inter-VLAN Router (10.10.115.2)
  # -------------------------------------------------------------
  pfsense-router:
    build:
      context: ../templates/router
      dockerfile: Dockerfile
    container_name: team15-pfsense
    hostname: pfsense.team15.arena.local
    environment:
      - TEAM_ID=15
      - PORT=80
      - PFSENSE_ADMIN_USER=admin
      - PFSENSE_ADMIN_PASSWORD=pfSense@Team15#bf8d2723
    networks:
      team_wan:
        ipv4_address: 10.10.115.2
      team_vlan20:
        ipv4_address: 172.35.20.1
      team_vlan201:
        ipv4_address: 172.35.201.1
      team_vlan202:
        ipv4_address: 172.35.202.1
      team_vlan203:
        ipv4_address: 172.35.203.1
      team_vlan204:
        ipv4_address: 172.35.204.1
    restart: unless-stopped

  # -------------------------------------------------------------
  # ESXi Host / Management (10.10.115.3)
  # -------------------------------------------------------------
  esxi-host:
    build:
      context: ../templates/esxi-mgmt
      dockerfile: Dockerfile
    container_name: team15-esxi
    hostname: esxi.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_wan:
        ipv4_address: 10.10.115.3
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 20: KH (Customer Zone)
  # -------------------------------------------------------------
  web-aio:
    build:
      context: ../templates/web-aio
      dockerfile: Dockerfile
    container_name: team15-web-aio
    hostname: web-aio.team15.arena.local
    environment:
      - TEAM_ID=15
      - PORT=80
    networks:
      team_vlan20:
        ipv4_address: 172.35.20.101
    restart: unless-stopped

  vpn:
    build:
      context: ../templates/vpn
      dockerfile: Dockerfile
    container_name: team15-vpn
    hostname: vpn.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan20:
        ipv4_address: 172.35.20.102
    restart: unless-stopped

  dc01:
    build:
      context: ../templates/dc-0153
      dockerfile: Dockerfile
    container_name: team15-dc01
    hostname: dc01.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan20:
        ipv4_address: 172.35.20.104
    restart: unless-stopped

  ws01:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws01
    container_name: team15-ws01
    hostname: ws01.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan20:
        ipv4_address: 172.35.20.105
    restart: unless-stopped

  ws02:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws02
    container_name: team15-ws02
    hostname: ws02.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan20:
        ipv4_address: 172.35.20.106
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 201: SCB_VLAN201 (Edge & Source Control)
  # -------------------------------------------------------------
  edge-proxy:
    build:
      context: ../templates/edge-proxy
      dockerfile: Dockerfile
    container_name: team15-edge-proxy
    hostname: edge-proxy.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan201:
        ipv4_address: 172.35.201.102
    restart: unless-stopped

  gitea:
    build:
      context: ../templates/supplychain/gitea
      dockerfile: Dockerfile
    container_name: team15-gitea
    hostname: gitea.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan201:
        ipv4_address: 172.35.201.103
    restart: unless-stopped

  ci-runner:
    build:
      context: ../templates/supplychain/ci-runner
      dockerfile: Dockerfile
    container_name: team15-ci-runner
    environment:
      - TEAM_ID=15
    networks:
      team_vlan201:
        ipv4_address: 172.35.201.104
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 202: SCB_VLAN202 (CI/CD Chain & K8s)
  # -------------------------------------------------------------
  jenkins:
    build:
      context: ../templates/supplychain/jenkins
      dockerfile: Dockerfile
    container_name: team15-jenkins
    hostname: jenkins.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan202:
        ipv4_address: 172.35.202.105
    restart: unless-stopped

  k3s-argocd:
    build:
      context: ../templates/k8s-argocd
      dockerfile: Dockerfile
    container_name: team15-k3s-argocd
    hostname: k3s-argocd.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan202:
        ipv4_address: 172.35.202.106
    restart: unless-stopped

  npm-registry:
    build:
      context: ../templates/supplychain/verdaccio
      dockerfile: Dockerfile
    container_name: team15-npm-registry
    hostname: npm-registry.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan202:
        ipv4_address: 172.35.202.107
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 203: SCB_VLAN203 (Ops & DNS)
  # -------------------------------------------------------------
  dns-ops:
    build:
      context: ../templates/ops/dns-ops
      dockerfile: Dockerfile
    container_name: team15-dns-ops
    hostname: dns-ops.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan203:
        ipv4_address: 172.35.203.109
    restart: unless-stopped

  app-runner:
    build:
      context: ../templates/ops/app-runner
      dockerfile: Dockerfile
    container_name: team15-app-runner
    hostname: app-runner.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan203:
        ipv4_address: 172.35.203.110
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 204: AdminPrivate (Team Laptops / Jumpbox)
  # -------------------------------------------------------------
  jumpbox:
    build:
      context: ../templates/jumpbox
      dockerfile: Dockerfile
    container_name: team15-jumpbox
    hostname: jumpbox.team15.arena.local
    environment:
      - TEAM_ID=15
    networks:
      team_vlan204:
        ipv4_address: 172.35.204.100
    restart: unless-stopped

networks:
  team_wan:
    name: arena_team15_wan
    ipam:
      driver: default
      config:
        - subnet: 10.10.115.0/24
          gateway: 10.10.115.1
  team_vlan20:
    name: arena_team15_vlan20
    ipam:
      driver: default
      config:
        - subnet: 172.35.20.0/24
          gateway: 172.35.20.254
  team_vlan201:
    name: arena_team15_vlan201
    ipam:
      driver: default
      config:
        - subnet: 172.35.201.0/24
          gateway: 172.35.201.254
  team_vlan202:
    name: arena_team15_vlan202
    ipam:
      driver: default
      config:
        - subnet: 172.35.202.0/24
          gateway: 172.35.202.254
  team_vlan203:
    name: arena_team15_vlan203
    ipam:
      driver: default
      config:
        - subnet: 172.35.203.0/24
          gateway: 172.35.203.254
  team_vlan204:
    name: arena_team15_vlan204
    ipam:
      driver: default
      config:
        - subnet: 172.35.204.0/24
          gateway: 172.35.204.254

