services:
  # -------------------------------------------------------------
  # pfSense Inter-VLAN Router (10.10.102.2)
  # -------------------------------------------------------------
  pfsense-router:
    build:
      context: ../templates/router
      dockerfile: Dockerfile
    container_name: team02-pfsense
    hostname: pfsense.team02.arena.local
    environment:
      - TEAM_ID=02
      - PORT=80
      - PFSENSE_ADMIN_USER=admin
      - PFSENSE_ADMIN_PASSWORD=pfSense@Team02#bc278a76
    ports:
      - "8102:80"
    networks:
      team_wan:
        ipv4_address: 10.10.102.2
      team_vlan20:
        ipv4_address: 172.22.20.1
      team_vlan201:
        ipv4_address: 172.22.201.1
      team_vlan202:
        ipv4_address: 172.22.202.1
      team_vlan203:
        ipv4_address: 172.22.203.1
      team_vlan204:
        ipv4_address: 172.22.204.1
    restart: unless-stopped

  # -------------------------------------------------------------
  # ESXi Host / Management (10.10.102.3)
  # -------------------------------------------------------------
  esxi-host:
    build:
      context: ../templates/esxi-mgmt
      dockerfile: Dockerfile
    container_name: team02-esxi
    hostname: esxi.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_wan:
        ipv4_address: 10.10.102.3
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 20: KH (Customer Zone)
  # -------------------------------------------------------------
  web-aio:
    build:
      context: ../templates/web-aio
      dockerfile: Dockerfile
    container_name: team02-web-aio
    hostname: web-aio.team02.arena.local
    environment:
      - TEAM_ID=02
      - PORT=80
    networks:
      team_vlan20:
        ipv4_address: 172.22.20.101
    restart: unless-stopped

  vpn:
    build:
      context: ../templates/vpn
      dockerfile: Dockerfile
    container_name: team02-vpn
    hostname: vpn.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan20:
        ipv4_address: 172.22.20.102
    restart: unless-stopped

  dc01:
    build:
      context: ../templates/dc-0153
      dockerfile: Dockerfile
    container_name: team02-dc01
    hostname: dc01.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan20:
        ipv4_address: 172.22.20.104
    restart: unless-stopped

  ws01:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws01
    container_name: team02-ws01
    hostname: ws01.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan20:
        ipv4_address: 172.22.20.105
    restart: unless-stopped

  ws02:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws02
    container_name: team02-ws02
    hostname: ws02.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan20:
        ipv4_address: 172.22.20.106
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 201: SCB_VLAN201 (Edge & Source Control)
  # -------------------------------------------------------------
  edge-proxy:
    build:
      context: ../templates/edge-proxy
      dockerfile: Dockerfile
    container_name: team02-edge-proxy
    hostname: edge-proxy.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan201:
        ipv4_address: 172.22.201.102
    restart: unless-stopped

  gitea:
    build:
      context: ../templates/supplychain/gitea
      dockerfile: Dockerfile
    container_name: team02-gitea
    hostname: gitea.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan201:
        ipv4_address: 172.22.201.103
    restart: unless-stopped

  ci-runner:
    build:
      context: ../templates/supplychain/ci-runner
      dockerfile: Dockerfile
    container_name: team02-ci-runner
    environment:
      - TEAM_ID=02
    networks:
      team_vlan201:
        ipv4_address: 172.22.201.104
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 202: SCB_VLAN202 (CI/CD Chain & K8s)
  # -------------------------------------------------------------
  jenkins:
    build:
      context: ../templates/supplychain/jenkins
      dockerfile: Dockerfile
    container_name: team02-jenkins
    hostname: jenkins.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan202:
        ipv4_address: 172.22.202.105
    restart: unless-stopped

  k3s-argocd:
    build:
      context: ../templates/k8s-argocd
      dockerfile: Dockerfile
    container_name: team02-k3s-argocd
    hostname: k3s-argocd.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan202:
        ipv4_address: 172.22.202.106
    restart: unless-stopped

  npm-registry:
    build:
      context: ../templates/supplychain/verdaccio
      dockerfile: Dockerfile
    container_name: team02-npm-registry
    hostname: npm-registry.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan202:
        ipv4_address: 172.22.202.107
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 203: SCB_VLAN203 (Ops & DNS)
  # -------------------------------------------------------------
  dns-ops:
    build:
      context: ../templates/ops/dns-ops
      dockerfile: Dockerfile
    container_name: team02-dns-ops
    hostname: dns-ops.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan203:
        ipv4_address: 172.22.203.109
    restart: unless-stopped

  app-runner:
    build:
      context: ../templates/ops/app-runner
      dockerfile: Dockerfile
    container_name: team02-app-runner
    hostname: app-runner.team02.arena.local
    environment:
      - TEAM_ID=02
    networks:
      team_vlan203:
        ipv4_address: 172.22.203.110
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 204: AdminPrivate (Team Laptops / Jumpbox)
  # -------------------------------------------------------------
  jumpbox:
    build:
      context: ../templates/jumpbox
      dockerfile: Dockerfile
    container_name: team02-jumpbox
    hostname: jumpbox.team02.arena.local
    environment:
      - TEAM_ID=02
    ports:
      - "8202:80"
    networks:
      team_vlan204:
        ipv4_address: 172.22.204.100
    restart: unless-stopped

networks:
  team_wan:
    name: arena_team02_wan
    ipam:
      driver: default
      config:
        - subnet: 10.10.102.0/24
          gateway: 10.10.102.1
  team_vlan20:
    name: arena_team02_vlan20
    ipam:
      driver: default
      config:
        - subnet: 172.22.20.0/24
          gateway: 172.22.20.254
  team_vlan201:
    name: arena_team02_vlan201
    ipam:
      driver: default
      config:
        - subnet: 172.22.201.0/24
          gateway: 172.22.201.254
  team_vlan202:
    name: arena_team02_vlan202
    ipam:
      driver: default
      config:
        - subnet: 172.22.202.0/24
          gateway: 172.22.202.254
  team_vlan203:
    name: arena_team02_vlan203
    ipam:
      driver: default
      config:
        - subnet: 172.22.203.0/24
          gateway: 172.22.203.254
  team_vlan204:
    name: arena_team02_vlan204
    ipam:
      driver: default
      config:
        - subnet: 172.22.204.0/24
          gateway: 172.22.204.254

