services:
  # -------------------------------------------------------------
  # pfSense Inter-VLAN Router (10.10.105.2)
  # -------------------------------------------------------------
  pfsense-router:
    build:
      context: ../templates/router
      dockerfile: Dockerfile
    container_name: team05-pfsense
    hostname: pfsense.team05.arena.local
    environment:
      - TEAM_ID=05
      - PORT=80
    networks:
      team_wan:
        ipv4_address: 10.10.105.2
      team_vlan20:
        ipv4_address: 172.25.20.1
      team_vlan201:
        ipv4_address: 172.25.201.1
      team_vlan202:
        ipv4_address: 172.25.202.1
      team_vlan203:
        ipv4_address: 172.25.203.1
      team_vlan204:
        ipv4_address: 172.25.204.1
    restart: unless-stopped

  # -------------------------------------------------------------
  # ESXi Host / Management (10.10.105.3)
  # -------------------------------------------------------------
  esxi-host:
    build:
      context: ../templates/esxi-mgmt
      dockerfile: Dockerfile
    container_name: team05-esxi
    hostname: esxi.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_wan:
        ipv4_address: 10.10.105.3
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 20: KH (Customer Zone)
  # -------------------------------------------------------------
  web-aio:
    build:
      context: ../templates/web-aio
      dockerfile: Dockerfile
    container_name: team05-web-aio
    hostname: web-aio.team05.arena.local
    environment:
      - TEAM_ID=05
      - PORT=80
    networks:
      team_vlan20:
        ipv4_address: 172.25.20.101
    restart: unless-stopped

  vpn:
    build:
      context: ../templates/vpn
      dockerfile: Dockerfile
    container_name: team05-vpn
    hostname: vpn.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan20:
        ipv4_address: 172.25.20.102
    restart: unless-stopped

  dc01:
    build:
      context: ../templates/dc-0153
      dockerfile: Dockerfile
    container_name: team05-dc01
    hostname: dc01.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan20:
        ipv4_address: 172.25.20.104
    restart: unless-stopped

  ws01:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws01
    container_name: team05-ws01
    hostname: ws01.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan20:
        ipv4_address: 172.25.20.105
    restart: unless-stopped

  ws02:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws02
    container_name: team05-ws02
    hostname: ws02.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan20:
        ipv4_address: 172.25.20.106
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 201: SCB_VLAN201 (Edge & Source Control)
  # -------------------------------------------------------------
  edge-proxy:
    build:
      context: ../templates/edge-proxy
      dockerfile: Dockerfile
    container_name: team05-edge-proxy
    hostname: edge-proxy.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan201:
        ipv4_address: 172.25.201.102
    restart: unless-stopped

  gitea:
    build:
      context: ../templates/supplychain/gitea
      dockerfile: Dockerfile
    container_name: team05-gitea
    hostname: gitea.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan201:
        ipv4_address: 172.25.201.103
    restart: unless-stopped

  ci-runner:
    build:
      context: ../templates/supplychain/ci-runner
      dockerfile: Dockerfile
    container_name: team05-ci-runner
    environment:
      - TEAM_ID=05
    networks:
      team_vlan201:
        ipv4_address: 172.25.201.104
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 202: SCB_VLAN202 (CI/CD Chain & K8s)
  # -------------------------------------------------------------
  jenkins:
    build:
      context: ../templates/supplychain/jenkins
      dockerfile: Dockerfile
    container_name: team05-jenkins
    hostname: jenkins.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan202:
        ipv4_address: 172.25.202.105
    restart: unless-stopped

  k3s-argocd:
    build:
      context: ../templates/k8s-argocd
      dockerfile: Dockerfile
    container_name: team05-k3s-argocd
    hostname: k3s-argocd.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan202:
        ipv4_address: 172.25.202.106
    restart: unless-stopped

  npm-registry:
    build:
      context: ../templates/supplychain/verdaccio
      dockerfile: Dockerfile
    container_name: team05-npm-registry
    hostname: npm-registry.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan202:
        ipv4_address: 172.25.202.107
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 203: SCB_VLAN203 (Ops & DNS)
  # -------------------------------------------------------------
  dns-ops:
    build:
      context: ../templates/ops/dns-ops
      dockerfile: Dockerfile
    container_name: team05-dns-ops
    hostname: dns-ops.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan203:
        ipv4_address: 172.25.203.109
    restart: unless-stopped

  app-runner:
    build:
      context: ../templates/ops/app-runner
      dockerfile: Dockerfile
    container_name: team05-app-runner
    hostname: app-runner.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan203:
        ipv4_address: 172.25.203.110
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 204: AdminPrivate (Team Laptops / Jumpbox)
  # -------------------------------------------------------------
  jumpbox:
    build:
      context: ../templates/jumpbox
      dockerfile: Dockerfile
    container_name: team05-jumpbox
    hostname: jumpbox.team05.arena.local
    environment:
      - TEAM_ID=05
    networks:
      team_vlan204:
        ipv4_address: 172.25.204.100
    restart: unless-stopped

networks:
  team_wan:
    name: arena_team05_wan
    ipam:
      driver: default
      config:
        - subnet: 10.10.105.0/24
          gateway: 10.10.105.1
  team_vlan20:
    name: arena_team05_vlan20
    ipam:
      driver: default
      config:
        - subnet: 172.25.20.0/24
          gateway: 172.25.20.1
  team_vlan201:
    name: arena_team05_vlan201
    ipam:
      driver: default
      config:
        - subnet: 172.25.201.0/24
          gateway: 172.25.201.1
  team_vlan202:
    name: arena_team05_vlan202
    ipam:
      driver: default
      config:
        - subnet: 172.25.202.0/24
          gateway: 172.25.202.1
  team_vlan203:
    name: arena_team05_vlan203
    ipam:
      driver: default
      config:
        - subnet: 172.25.203.0/24
          gateway: 172.25.203.1
  team_vlan204:
    name: arena_team05_vlan204
    ipam:
      driver: default
      config:
        - subnet: 172.25.204.0/24
          gateway: 172.25.204.1

