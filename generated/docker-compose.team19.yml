services:
  # -------------------------------------------------------------
  # pfSense Inter-VLAN Router (10.10.119.2)
  # -------------------------------------------------------------
  pfsense-router:
    build:
      context: ../templates/router
      dockerfile: Dockerfile
    container_name: team19-pfsense
    hostname: pfsense.team19.arena.local
    environment:
      - TEAM_ID=19
      - PORT=80
      - PFSENSE_ADMIN_USER=admin
      - PFSENSE_ADMIN_PASSWORD=pfSense@Team19#e1bf5dc3
    ports:
      - "8119:80"
    networks:
      team_wan:
        ipv4_address: 10.10.119.2
      team_vlan20:
        ipv4_address: 172.39.20.1
      team_vlan201:
        ipv4_address: 172.39.201.1
      team_vlan202:
        ipv4_address: 172.39.202.1
      team_vlan203:
        ipv4_address: 172.39.203.1
      team_vlan204:
        ipv4_address: 172.39.204.1
    restart: unless-stopped

  # -------------------------------------------------------------
  # ESXi Host / Management (10.10.119.3)
  # -------------------------------------------------------------
  esxi-host:
    build:
      context: ../templates/esxi-mgmt
      dockerfile: Dockerfile
    container_name: team19-esxi
    hostname: esxi.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_wan:
        ipv4_address: 10.10.119.3
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 20: KH (Customer Zone)
  # -------------------------------------------------------------
  web-aio:
    build:
      context: ../templates/web-aio
      dockerfile: Dockerfile
    container_name: team19-web-aio
    hostname: web-aio.team19.arena.local
    environment:
      - TEAM_ID=19
      - PORT=80
    networks:
      team_vlan20:
        ipv4_address: 172.39.20.101
    restart: unless-stopped

  vpn:
    build:
      context: ../templates/vpn
      dockerfile: Dockerfile
    container_name: team19-vpn
    hostname: vpn.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan20:
        ipv4_address: 172.39.20.102
    restart: unless-stopped

  dc01:
    build:
      context: ../templates/dc-0153
      dockerfile: Dockerfile
    container_name: team19-dc01
    hostname: dc01.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan20:
        ipv4_address: 172.39.20.104
    restart: unless-stopped

  ws01:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws01
    container_name: team19-ws01
    hostname: ws01.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan20:
        ipv4_address: 172.39.20.105
    restart: unless-stopped

  ws02:
    build:
      context: ../templates/workstations
      dockerfile: Dockerfile.ws02
    container_name: team19-ws02
    hostname: ws02.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan20:
        ipv4_address: 172.39.20.106
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 201: SCB_VLAN201 (Edge & Source Control)
  # -------------------------------------------------------------
  edge-proxy:
    build:
      context: ../templates/edge-proxy
      dockerfile: Dockerfile
    container_name: team19-edge-proxy
    hostname: edge-proxy.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan201:
        ipv4_address: 172.39.201.102
    restart: unless-stopped

  gitea:
    build:
      context: ../templates/supplychain/gitea
      dockerfile: Dockerfile
    container_name: team19-gitea
    hostname: gitea.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan201:
        ipv4_address: 172.39.201.103
    restart: unless-stopped

  ci-runner:
    build:
      context: ../templates/supplychain/ci-runner
      dockerfile: Dockerfile
    container_name: team19-ci-runner
    environment:
      - TEAM_ID=19
    networks:
      team_vlan201:
        ipv4_address: 172.39.201.104
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 202: SCB_VLAN202 (CI/CD Chain & K8s)
  # -------------------------------------------------------------
  jenkins:
    build:
      context: ../templates/supplychain/jenkins
      dockerfile: Dockerfile
    container_name: team19-jenkins
    hostname: jenkins.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan202:
        ipv4_address: 172.39.202.105
    restart: unless-stopped

  k3s-argocd:
    build:
      context: ../templates/k8s-argocd
      dockerfile: Dockerfile
    container_name: team19-k3s-argocd
    hostname: k3s-argocd.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan202:
        ipv4_address: 172.39.202.106
    restart: unless-stopped

  npm-registry:
    build:
      context: ../templates/supplychain/verdaccio
      dockerfile: Dockerfile
    container_name: team19-npm-registry
    hostname: npm-registry.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan202:
        ipv4_address: 172.39.202.107
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 203: SCB_VLAN203 (Ops & DNS)
  # -------------------------------------------------------------
  dns-ops:
    build:
      context: ../templates/ops/dns-ops
      dockerfile: Dockerfile
    container_name: team19-dns-ops
    hostname: dns-ops.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan203:
        ipv4_address: 172.39.203.109
    restart: unless-stopped

  app-runner:
    build:
      context: ../templates/ops/app-runner
      dockerfile: Dockerfile
    container_name: team19-app-runner
    hostname: app-runner.team19.arena.local
    environment:
      - TEAM_ID=19
    networks:
      team_vlan203:
        ipv4_address: 172.39.203.110
    restart: unless-stopped

  # -------------------------------------------------------------
  # VLAN 204: AdminPrivate (Team Laptops / Jumpbox)
  # -------------------------------------------------------------
  jumpbox:
    build:
      context: ../templates/jumpbox
      dockerfile: Dockerfile
    container_name: team19-jumpbox
    hostname: jumpbox.team19.arena.local
    environment:
      - TEAM_ID=19
    ports:
      - "8219:80"
    networks:
      team_vlan204:
        ipv4_address: 172.39.204.100
    restart: unless-stopped

networks:
  team_wan:
    name: arena_team19_wan
    ipam:
      driver: default
      config:
        - subnet: 10.10.119.0/24
          gateway: 10.10.119.1
  team_vlan20:
    name: arena_team19_vlan20
    ipam:
      driver: default
      config:
        - subnet: 172.39.20.0/24
          gateway: 172.39.20.254
  team_vlan201:
    name: arena_team19_vlan201
    ipam:
      driver: default
      config:
        - subnet: 172.39.201.0/24
          gateway: 172.39.201.254
  team_vlan202:
    name: arena_team19_vlan202
    ipam:
      driver: default
      config:
        - subnet: 172.39.202.0/24
          gateway: 172.39.202.254
  team_vlan203:
    name: arena_team19_vlan203
    ipam:
      driver: default
      config:
        - subnet: 172.39.203.0/24
          gateway: 172.39.203.254
  team_vlan204:
    name: arena_team19_vlan204
    ipam:
      driver: default
      config:
        - subnet: 172.39.204.0/24
          gateway: 172.39.204.254

